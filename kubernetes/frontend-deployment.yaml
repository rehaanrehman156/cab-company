apiVersion: apps/v1
kind: Deployment
metadata:
  name: cab-frontend
  namespace: cab-company
  labels:
    app: cab-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cab-frontend
  template:
    metadata:
      labels:
        app: cab-frontend
    spec:
      containers:
        - name: cab-frontend
          image: 328064416060.dkr.ecr.ap-south-1.amazonaws.com/cab-company-dev-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
