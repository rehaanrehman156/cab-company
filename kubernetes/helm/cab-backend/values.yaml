nameOverride: ""
fullnameOverride: "cab-backend"

replicaCount: 2

image:
  repository: 328064416060.dkr.ecr.ap-south-1.amazonaws.com/cab-company-dev-backend
  tag: latest
  pullPolicy: Always

serviceAccount:
  create: true
  name: cab-backend-sa
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_BACKEND_IRSA_ROLE_ARN

env:
  NODE_ENV: production
  PORT: "5000"
  AWS_REGION: ap-south-1
  APP_SECRETS_MANAGER_SECRET_ID: cab-company/dev/backend
  REQUIRE_RUNTIME_SECRETS: "false"

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 15
