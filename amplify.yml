version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing frontend dependencies..."
        - cd frontend/customer-app
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/customer-app/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/customer-app/node_modules/**
