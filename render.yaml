services:
  - type: web
    name: cab-company-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: cab-company-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: cab-company-driver
    runtime: static
    buildCommand: cd frontend/driver-app && npm install && npm run build
    staticPublishPath: frontend/driver-app/build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://cab-company-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cab-company-db
    plan: free
    databaseName: cabcompany
